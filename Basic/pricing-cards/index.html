<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Cards — 三档订阅方案</title>

    <!-- ===== SEO 标签 ===== -->
    <meta name="description" content="定价卡片组件：Basic / Pro / Premium 三档方案并排比较，中间推荐方案突出展示；Flexbox 布局、等高卡片、按钮悬停与焦点状态。">
    <meta name="author" content="DoubleCanzy">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://doublecanzy.github.io/web-projects-HTML-CSS/Basic/pricing-cards/">

    <!-- ===== Open Graph 标签（社交分享用） ===== -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Pricing Cards — 三档订阅方案">
    <meta property="og:description" content="三张定价卡片并排：推荐方案突出、等高布局、按钮对齐底部。">
    <meta property="og:url" content="https://doublecanzy.github.io/web-projects-HTML-CSS/Basic/pricing-cards/">
    <meta property="og:locale" content="zh_CN">

    <!-- ===== Google Fonts（提升排版） ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- ===== 样式表 ===== -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="page">
        <div class="container">

            <header class="page-header">
                <h1>选择适合你的方案</h1>
                <p>随时可以升级或取消，年付另有优惠</p>
            </header>

            <!-- ===== 定价卡片行（Flexbox + gap 布局） ===== -->
            <section class="cards" aria-label="订阅方案对比">

                <!-- 方案一：Basic -->
                <article class="card">
                    <h2 class="plan-name">Basic</h2>
                    <p class="price">¥0<span class="period">/ 月</span></p>
                    <p class="tagline">适合刚入门的个人用户</p>
                    <ul class="features">
                        <li>3 个项目</li>
                        <li>基础报表</li>
                        <li>社区论坛支持</li>
                        <li>1 个团队成员</li>
                    </ul>
                    <a class="btn btn-outline" href="#">免费开始</a>
                </article>

                <!-- 方案二：Pro（推荐，突出展示） -->
                <article class="card card--recommended">
                    <p class="badge">最受欢迎</p>
                    <h2 class="plan-name">Pro</h2>
                    <p class="price">¥68<span class="period">/ 月</span></p>
                    <p class="tagline">适合认真做事的个人创作者</p>
                    <ul class="features">
                        <li>不限项目</li>
                        <li>高级报表</li>
                        <li>邮件支持</li>
                        <li>自定义域名</li>
                        <li>AI 智能助手</li>
                    </ul>
                    <a class="btn" href="#">立即订阅</a>
                </article>

                <!-- 方案三：Premium -->
                <article class="card">
                    <h2 class="plan-name">Premium</h2>
                    <p class="price">¥168<span class="period">/ 月</span></p>
                    <p class="tagline">适合团队与企业</p>
                    <ul class="features">
                        <li>不限项目与成员</li>
                        <li>全部报表功能</li>
                        <li>24/7 优先支持</li>
                        <li>专属客户顾问</li>
                        <li>AI 智能助手</li>
                        <li>自定义域名</li>
                    </ul>
                    <a class="btn btn-outline" href="#">立即订阅</a>
                </article>

            </section>

        </div>
    </main>

</body>
</html>
